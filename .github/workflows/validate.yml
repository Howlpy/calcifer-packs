name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  # Placeholder: set to the real repository of Calcifer (the installer's own tree-hash and `pack check` code).
  CALCIFER_REPO: https://github.com/Howlpy/calcifer.git

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # official entries pin commits of this repository: they must be in the history

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Calcifer (canonical tree hash and `pack check`)
        run: pip install "calcifer @ git+${CALCIFER_REPO}"

      - name: Index schema, commits, paths and tree hashes
        run: |
          python scripts/validate_index.py \
            --self-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --self-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git"

      # Only the project's own packs are executed here. Community packs live elsewhere and are never run in CI.
      - name: Check official packs (manifest, imports, load, tests)
        run: |
          set -e
          for dir in packs/*/; do
            echo "== ${dir}"
            calcifer pack check "${dir}" --run
          done
