# The Calcifer pack catalog. `calcifer pack search|info|install` read this file.
#
# Schema (every field is required; CI rejects unknown fields, bad values and unsorted entries):
#   name          pack name, as in the pack's pack.yaml (lowercase, digits, _ and -; 2-31 characters)
#   description   one sentence, at most 300 characters
#   url           git URL of the repository (https:// or ssh://); official packs use this repository
#   path          folder inside the repository that holds pack.yaml (official packs: packs/<name>), or null when it
#                 is the repository root
#   commit        FULL 40-character lowercase sha. The catalog pins a commit, never a branch
#   sha256        output of `calcifer pack hash <that folder at that commit>`
#   min_calcifer  oldest Calcifer release the pack works with (X.Y.Z) or null; must equal the pack's pack.yaml
#   contract      pack contract version (1); must equal the pack's pack.yaml
#   maintainer    who answers for the pack (GitHub user or organisation)
#   tier          official (maintained by the project, lives in packs/) | community (lives in its author's repository)
#   tags          list of short lowercase words (at most 12)
#   homepage      https URL or null
#
# Entries are sorted by name. Only the project's maintainers add `tier: official`.
packs:
  - name: hello_notes
    description: A tiny notebook for the owner - add short notes and read the latest ones (the catalog's example pack).
    url: https://github.com/Howlpy/calcifer-packs.git
    path: packs/hello_notes
    commit: 9d78ecfe7e17dd19196f5a71dc0b73586c0653f6
    sha256: 95d27d7205d9ac6cfd90051e581c5a89c29e0744868734a99e095a73a8aaf949
    min_calcifer: 0.1.0
    contract: 1
    maintainer: Howlpy
    tier: official
    tags: [notes, example]
    homepage: https://github.com/Howlpy/calcifer-packs/tree/main/packs/hello_notes
